<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 家庭实时点餐系统 🎀</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --primary-color: #FFC0CB;
            --primary-dark: #FF69B4;
            --bg-color: #FFF5F7;
            --card-bg: #FFFFFF;
            --text-main: #5C5C5C;
            --border-radius: 24px;
            --shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); }

        /* 加载动画 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--primary-color);
            border-top: 4px solid var(--primary-dark); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* 状态条 */
        .status-bar {
            background: #fff; padding: 10px 20px; border-radius: 50px;
            margin-bottom: 20px; display: flex; justify-content: space-between;
            font-size: 0.85rem; color: var(--primary-dark); box-shadow: var(--shadow);
        }

        .header { text-align: center; margin-bottom: 30px; padding: 25px; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow); border: 2px solid #FFE4E1; }
        .header h1 { color: var(--primary-dark); }

        .main-layout { display: flex; gap: 25px; }
        @media (max-width: 850px) { .main-layout { flex-direction: column; } }

        /* 菜谱卡片 */
        .menu-section { flex: 2; }
        .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .dish-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 15px; box-shadow: var(--shadow); position: relative; transition: 0.3s; }
        .dish-card:hover { transform: translateY(-5px); }
        .dish-img { width: 100%; height: 150px; object-fit: cover; border-radius: 18px; background: #FFF0F5; margin-bottom: 10px; }

        /* 购物车 */
        .cart-section { flex: 1; background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow); position: sticky; top: 20px; border: 2px solid #FFE4E1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #FFDDE2; }
        .user-tag { font-size: 10px; background: var(--primary-color); color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }

        /* 按钮与表单 */
        button { border: none; cursor: pointer; border-radius: 50px; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: var(--primary-color); color: white; padding: 10px 20px; font-weight: bold; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-action { width: 30px; height: 30px; background: #f0f0f0; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: var(--border-radius); width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-dark); }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
        .img-preview { width: 100%; height: 150px; border: 2px dashed var(--primary-color); border-radius: 10px; margin-top: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .img-preview img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="app">
    <div v-if="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: var(--primary-dark);">正在同步云端数据...</p>
    </div>

    <div class="app-container">
        <div class="status-bar">
            <span>当前身份：<strong>{{ userName }}</strong></span>
            <span>🌐 云端实时连接中</span>
        </div>

        <header class="header">
            <h1>💕 家庭实时共享菜谱 💕</h1>
            <p>多端同步，实时更新</p>
        </header>

        <div class="main-layout">
            <section class="menu-section">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <h2>🍲 美味菜库</h2>
                    <button class="btn-primary" @click="openModal()">➕ 新增菜品</button>
                </div>
                
                <div class="dish-grid">
                    <div class="dish-card" v-for="dish in dishes" :key="dish.id">
                        <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 5px;">
                            <button class="btn-action" @click="openModal(dish)">✏️</button>
                            <button class="btn-action" @click="handleDelete(dish.id)">🗑️</button>
                        </div>
                        <img v-if="dish.image" :src="dish.image" class="dish-img">
                        <div v-else class="dish-img" style="font-size: 12px; color: #ccc; display: flex; align-items: center; justify-content: center;">暂无图片</div>
                        <h3>{{ dish.name }}</h3>
                        <p style="color: var(--primary-dark); font-weight: bold;">{{ dish.price }}</p>
                        <button class="btn-primary" style="width: 100%; margin-top: 10px;" @click="addToCart(dish)">加入菜单</button>
                    </div>
                </div>
            </section>

            <aside class="cart-section">
                <h2 style="text-align: center; color: var(--primary-dark); margin-bottom: 20px;">🛒 共享采购清单</h2>
                <div v-if="cart.length === 0" style="text-align: center; color: #ccc; padding: 40px 0;">清单是空的~</div>
                <div class="cart-item" v-for="item in cart" :key="item.id">
                    <div>
                        <strong>{{ item.name }}</strong>
                        <span class="user-tag">{{ item.addedBy }}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button class="btn-action" @click="updateQty(item.id, -1)">-</button>
                        <span>{{ item.qty }}</span>
                        <button class="btn-action" @click="updateQty(item.id, 1)">+</button>
                    </div>
                </div>
                <div v-if="cart.length > 0" style="margin-top: 20px; border-top: 2px solid var(--primary-color); padding-top: 15px; text-align: right;">
                    <strong>预计花费：<span style="color: var(--primary-dark); font-size: 1.5rem;">{{ totalAmount }}</span></strong>
                </div>
            </aside>
        </div>
    </div>

    <div class="modal" v-if="showModal" @click.self="showModal = false">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; color: var(--primary-dark);">{{ isEdit ? '编辑菜品' : '新增菜品' }}</h2>
            <div class="form-group">
                <label>菜名</label>
                <input type="text" v-model="form.name">
            </div>
            <div class="form-group">
                <label>参考价格</label>
                <input type="text" v-model="form.price">
            </div>
            <div class="form-group">
                <label>图片</label>
                <input type="file" ref="fileInput" hidden @change="handleFileUpload">
                <div class="img-preview" @click="$refs.fileInput.click()">
                    <img v-if="form.image" :src="form.image">
                    <span v-else>点击上传图片</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-primary" style="flex: 1; background: #eee; color: #666;" @click="showModal = false">取消</button>
                <button class="btn-primary" style="flex: 1;" @click="submitForm">保存同步</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, setDoc, doc, deleteDoc, onSnapshot, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ==========================================
    // 步骤 4：请在此处填入你的 Firebase 配置
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAhyyhVJtYDZ--dUtxnUicbr4t1_ulGnvs",
    authDomain: "famliy-menu.firebaseapp.com",
    databaseURL: "https://famliy-menu-default-rtdb.firebaseio.com",
    projectId: "famliy-menu",
    storageBucket: "famliy-menu.firebasestorage.app",
    messagingSenderId: "867341636402",
    appId: "1:867341636402:web:cccdd517ae5c56608ffd2b",
    measurementId: "G-CS8KX44MTG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const { createApp, ref, reactive, computed, onMounted } = Vue;

    createApp({
        setup() {
            const dishes = ref([]);
            const cart = ref([]);
            const loading = ref(true);
            const showModal = ref(false);
            const isEdit = ref(false);
            const userName = ref(localStorage.getItem('family_user_name') || '');
            const form = reactive({ id: null, name: '', price: '', image: '' });

            // 初始化身份
            onMounted(() => {
                if (!userName.value) {
                    const name = prompt("请输入您的称呼（如：老婆、老公）：") || '神秘家人';
                    userName.value = name;
                    localStorage.setItem('family_user_name', name);
                }
                initRealtimeSync();
            });

            // --- 核心：实时同步逻辑 ---
            const initRealtimeSync = () => {
                // 1. 监听菜谱库
                const dishQuery = query(collection(db, "dishes"), orderBy("createdAt", "desc"));
                onSnapshot(dishQuery, (snapshot) => {
                    dishes.value = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    // 数据为空时初始化默认菜品 (仅第一次)
                    if (dishes.value.length === 0 && loading.value) {
                        seedData();
                    }
                    loading.value = false;
                });

                // 2. 监听清单
                onSnapshot(collection(db, "cart"), (snapshot) => {
                    cart.value = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                });
            };

            // --- 数据操作 ---
            const openModal = (dish = null) => {
                if (dish) {
                    isEdit.value = true;
                    Object.assign(form, dish);
                } else {
                    isEdit.value = false;
                    Object.assign(form, { id: null, name: '', price: '', image: '' });
                }
                showModal.value = true;
            };

            const submitForm = async () => {
                if (!form.name) return alert("写个名字嘛~");
                const data = { ...form, createdAt: Date.now() };
                delete data.id;

                try {
                    if (isEdit.value) {
                        await setDoc(doc(db, "dishes", form.id), data);
                    } else {
                        await addDoc(collection(db, "dishes"), data);
                    }
                    showModal.value = false;
                } catch (e) { alert("同步失败：" + e.message); }
            };

            const handleDelete = async (id) => {
                if (confirm("确定删除这道菜吗？")) {
                    await deleteDoc(doc(db, "dishes", id));
                }
            };

            // --- 点餐逻辑 ---
            const addToCart = async (dish) => {
                const exist = cart.value.find(c => c.dishId === dish.id);
                if (exist) {
                    updateQty(exist.id, 1);
                } else {
                    await addDoc(collection(db, "cart"), {
                        dishId: dish.id,
                        name: dish.name,
                        price: dish.price,
                        qty: 1,
                        addedBy: userName.value
                    });
                }
            };

            const updateQty = async (cartId, delta) => {
                const item = cart.value.find(c => c.id === cartId);
                const newQty = item.qty + delta;
                if (newQty <= 0) {
                    await deleteDoc(doc(db, "cart", cartId));
                } else {
                    await setDoc(doc(db, "cart", cartId), { ...item, qty: newQty });
                }
            };

            // --- 图片压缩处理 ---
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_W = 300; // 进一步压缩以适配云端存储
                        canvas.width = MAX_W;
                        canvas.height = img.height * (MAX_W / img.width);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        form.image = canvas.toDataURL('image/jpeg', 0.6);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const seedData = async () => {
                const defaults = [
                    { name: '糖醋排骨', price: '45', image: '', createdAt: Date.now() },
                    { name: '清炒时蔬', price: '12', image: '', createdAt: Date.now() - 1000 }
                ];
                for (let d of defaults) {
                    await addDoc(collection(db, "dishes"), d);
                }
            };

            const totalAmount = computed(() => {
                const total = cart.value.reduce((acc, cur) => {
                    const price = parseFloat(cur.price.replace(/[^\d.]/g, '')) || 0;
                    return acc + (price * cur.qty);
                }, 0);
                return total === 0 ? '--' : total.toFixed(1);
            });

            return {
                dishes, cart, loading, showModal, isEdit, form, userName, totalAmount,
                openModal, submitForm, handleDelete, addToCart, updateQty, handleFileUpload
            };
        }
    }).mount('#app');
</script>
</body>
</html>
